[package]
name = "stremhu-rs"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
# For the daily sweep, which runs at a wall-clock time in the machine's own timezone.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4.3"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "cookies", "form", "multipart"] }
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["io"] }
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["fs", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[build-dependencies]
cmake = "0.1.58"

# Only on unix, and only for two calls: statvfs for free space, and sysconf for the clock
# tick the process times are counted in. Windows gets both from its own API.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
